version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The lint toolchain stays on ESLint 9 until eslint-plugin-jsx-a11y
      # supports ESLint 10 (see packages/lint/README.md); the two
      # must move together, so their majors are updated by hand.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # packages/lint pins typescript 6.0 because typescript-eslint supports
      # <6.1 and TypeScript 7 has no JavaScript compiler API (see
      # packages/lint/README.md). Builds use TypeScript 7; majors are manual.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
