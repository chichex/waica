name: Publish

on:
  push:
    tags: ['v*', 'chichex-waica-v*']

# OIDC trusted publishing: npm trusts this repo+workflow directly, so there is
# no token stored anywhere and provenance comes for free.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads the packageManager field
      # from the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag is the release intent; refuse to publish a version that does
      # not match it (e.g. a tag pushed on the wrong commit). Checking the CLI
      # alone covers all five packages: they release in lockstep, and the unit
      # test below fails if any of them is left on a different version.
      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match packages/cli@$version" >&2
            exit 1
          fi

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      # Builds from clean library dists, validates packed exports and imports
      # with plain Node, and also builds the editor before the CLI bundles it.
      - name: Build and verify published package shape
        run: pnpm test:dist

      # The libraries go first: a CLI on npm whose generated projects depend on
      # @waica versions the registry does not have yet is broken for everyone
      # who installs it in between. Everything that can fail has already run,
      # so what is left is registry trouble — if it strikes mid-sequence, npm
      # will not take the same version twice, and the fix is to bump the patch
      # and re-tag the whole set.
      - name: Prepare the libraries for publishing
        run: node scripts/prepare-publish.mjs > /tmp/publish-order.txt

      # @waica is a scoped package with no publishConfig of its own, and scoped
      # packages default to restricted.
      - name: Publish the libraries
        run: |
          while read -r directory; do
            echo "::group::npm publish $directory"
            (cd "$directory" && npm publish --access public)
            echo "::endgroup::"
          done < /tmp/publish-order.txt

      # npm publish does not rewrite the workspace:^ devDependency the way
      # pnpm publish would; devDependencies mean nothing to consumers, so
      # drop them from the published manifest instead.
      - name: Strip devDependencies from the manifest
        run: npm pkg delete devDependencies
        working-directory: packages/cli

      - name: Publish
        run: npm publish
        working-directory: packages/cli

  # One-shot legacy publish: the final @chichex/waica, which tells old-name
  # installs about the rename to @waica/cli (see stubs/chichex-waica). It
  # reuses this workflow file because npm's trusted-publisher config for
  # @chichex/waica trusts exactly this repo + publish.yml.
  publish-rename-stub:
    if: startsWith(github.ref_name, 'chichex-waica-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Trusted publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Check tag matches stub version
        run: |
          version="$(node -p "require('./stubs/chichex-waica/package.json').version")"
          if [ "chichex-waica-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match stubs/chichex-waica@$version" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
        working-directory: stubs/chichex-waica
