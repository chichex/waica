name: CI

# Pull-request gate: the local verification ladder from .sdd/project.md, run
# on every PR against main so the ladder is no longer only a local habit.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# The ladder runs as four parallel jobs (each with its own checkout, cached
# pnpm/node setup and install), the desktop one on all three OSes. `verify`
# aggregates them so the required status check keeps its name and is red
# unless all of them succeeded.
jobs:
  checks:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads the packageManager field
      # from the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and component tests
        run: pnpm test

  dist:
    name: test:dist + audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads the packageManager field
      # from the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fresh build plus packed-package checks, including a Chrome leg.
      - name: Published package shape
        run: pnpm test:dist

      - name: Audit dependencies
        run: pnpm audit --audit-level high

  e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads the packageManager field
      # from the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Needs the runner's system Google Chrome; a missing browser is red.
      - name: Runtime browser e2e
        run: pnpm test:e2e

  # Issue #200 CA-26: each OS exports a platformer and a third-person Project
  # for itself with `waica export desktop` and launches the packaged app
  # (scripts/runtime-e2e-desktop.mjs). Its checks are logical state, never
  # pixels: a runner without a GPU can draw a blank frame (#151).
  desktop:
    name: test:desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads the packageManager field
      # from the root package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @electron/packager downloads each platform's Electron zip into
      # Electron's cache; the version is pinned in packages/cli/package.json.
      - name: Cache the Electron zips
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('packages/cli/package.json') }}

      # Linux has no display: Xvfb, with a window manager so the window can
      # go fullscreen (without one, X11 never grants it).
      - name: Install a window manager
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox

      - name: Packaged desktop app smoke (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & pnpm test:desktop'

      - name: Packaged desktop app smoke
        if: runner.os != 'Linux'
        run: pnpm test:desktop

  verify:
    runs-on: ubuntu-latest
    needs: [checks, dist, e2e, desktop]
    if: always()
    steps:
      - name: All CI jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
